name: release

# Reusable workflow: construye la imagen de una app y publica la nueva versión
# escribiendo stacks/<app_name>/versions.env en avesperinas/infra.
#
# Uso desde un repo de app (.github/workflows/release.yml):
#
#   name: release
#   on: { push: { tags: ['v*'] } }
#   jobs:
#     release:
#       uses: avesperinas/workflows/.github/workflows/release.yml@main
#       with:
#         app_name: caudal
#       secrets:
#         infra_token: ${{ secrets.INFRA_TOKEN }}

on:
  workflow_call:
    inputs:
      app_name:
        description: Nombre del stack en infra/stacks/<app_name>
        required: true
        type: string
      dockerfile:
        description: Ruta al Dockerfile, relativa a la raíz del repo
        required: false
        type: string
        default: Dockerfile
      context:
        description: Contexto de build
        required: false
        type: string
        default: .
      infra_repo:
        description: Repo que guarda el estado desplegado
        required: false
        type: string
        default: avesperinas/infra
    secrets:
      infra_token:
        description: PAT fine-grained con Contents:read/write sobre infra
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar el tag
        run: |
          set -euo pipefail
          tag='${{ github.ref_name }}'
          # `latest` está prohibido por diseño: el estado desplegado debe ser
          # siempre una referencia inmutable.
          if [ "$tag" = "latest" ]; then
            echo "::error::'latest' no se puede usar como tag de release."
            exit 1
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::El tag '$tag' no sigue el formato vX.Y.Z"; exit 1 ;;
          esac

      - name: Calcular referencias de imagen
        id: meta
        run: |
          set -euo pipefail
          # ghcr exige el nombre del repositorio en minúsculas.
          repo_lc=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          {
            echo "repo_lc=${repo_lc}"
            echo "sha_short=${GITHUB_SHA::7}"
            echo "image=ghcr.io/${repo_lc}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  bump:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.infra_repo }}
          token: ${{ secrets.infra_token }}
          path: infra
          # Necesitamos historia para poder rebasar ante un push concurrente.
          fetch-depth: 0

      - name: Publicar la versión en infra
        env:
          APP: ${{ inputs.app_name }}
          TAG: ${{ github.ref_name }}
          SRC_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd infra

          stack="stacks/${APP}"
          if [ ! -d "$stack" ]; then
            echo "::error::El stack '${stack}' no existe en ${{ inputs.infra_repo }}."
            echo "::error::Créalo (docker-compose.yml + versions.env) antes de publicar un tag."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="${GITHUB_REF_NAME_INFRA:-main}"

          # Reescribimos el fichero en cada intento en lugar de rebasar un commit
          # ya hecho: así dos apps que publican a la vez nunca entran en conflicto.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin "$branch"
            git reset --quiet --hard "origin/${branch}"

            printf 'IMAGE_TAG=%s\n' "$TAG" > "${stack}/versions.env"
            git add "${stack}/versions.env"

            if git diff --cached --quiet; then
              echo "versions.env ya apunta a ${TAG}; nada que hacer."
              exit 0
            fi

            git commit --quiet -m "deploy(${APP}): ${TAG}" \
              -m "Origen: ${SRC_REPO}@${TAG}"

            if git push --quiet origin "HEAD:${branch}"; then
              echo "✅ ${APP} -> ${TAG} publicado en ${{ inputs.infra_repo }}"
              exit 0
            fi

            echo "Push rechazado (intento ${attempt}); reintentando sobre la punta actual."
            sleep $(( attempt * 3 ))
          done

          echo "::error::No se pudo actualizar infra tras 5 intentos."
          exit 1
