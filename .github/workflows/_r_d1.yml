name: r-d1
on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar el tag
        run: |
          set -euo pipefail
          tag='${{ github.ref_name }}'
          # `latest` está prohibido por diseño: el estado desplegado debe ser
          # siempre una referencia inmutable.
          if [ "$tag" = "latest" ]; then
            echo "::error::'latest' no se puede usar como tag de release."
            exit 1
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::El tag '$tag' no sigue el formato vX.Y.Z"; exit 1 ;;
          esac

