name: r-b2

# Reusable workflow: construye la imagen de una app y publica la nueva versión
# escribiendo stacks/<app_name>/versions.env en avesperinas/infra.
#
# Uso desde un repo de app (.github/workflows/release.yml):
#
#   name: release
#   on: { push: { tags: ['v*'] } }
#   jobs:
#     release:
#       uses: avesperinas/workflows/.github/workflows/release.yml@main
#       with:
#         app_name: caudal
#       secrets:
#         infra_token: ${{ secrets.INFRA_TOKEN }}

on:
  workflow_call:
    inputs:
      app_name:
        description: Nombre del stack en infra/stacks/<app_name>
        required: true
        type: string
      dockerfile:
        description: Ruta al Dockerfile, relativa a la raíz del repo
        required: false
        type: string
        default: Dockerfile
      context:
        description: Contexto de build
        required: false
        type: string
        default: .
      image_name:
        description: >-
          Nombre de la imagen bajo ghcr.io/<owner>/. Por defecto, el del repo.
          Sirve para repos que publican más de una imagen (p. ej. caudal-backup).
        required: false
        type: string
        default: ''
      bump_infra:
        description: >-
          Si es false, solo construye y publica la imagen sin tocar infra.
          Úsalo en las imágenes secundarias de un repo para no duplicar el commit.
        required: false
        type: boolean
        default: true
      infra_repo:
        description: Repo que guarda el estado desplegado
        required: false
        type: string
        default: avesperinas/infra
    secrets:
      infra_token:
        description: PAT fine-grained con Contents:read/write sobre infra
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar el tag
        run: |
          set -euo pipefail
          tag='${{ github.ref_name }}'
          # `latest` está prohibido por diseño: el estado desplegado debe ser
          # siempre una referencia inmutable.
          if [ "$tag" = "latest" ]; then
            echo "::error::'latest' no se puede usar como tag de release."
            exit 1
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::El tag '$tag' no sigue el formato vX.Y.Z"; exit 1 ;;
          esac

      - name: Calcular referencias de imagen
        id: meta
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          # ghcr exige owner y nombre de imagen en minúsculas.
          owner_lc=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          if [ -n "$IMAGE_NAME" ]; then
            name_lc=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          else
            name_lc=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
          fi
          {
            echo "sha_short=${GITHUB_SHA::7}"
            echo "image=ghcr.io/${owner_lc}/${name_lc}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
