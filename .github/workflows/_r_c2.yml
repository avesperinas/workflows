name: r-c2
on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
    secrets:
      infra_token:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar el tag
        run: |
          set -euo pipefail
          tag='${{ github.ref_name }}'
          # `latest` está prohibido por diseño: el estado desplegado debe ser
          # siempre una referencia inmutable.
          if [ "$tag" = "latest" ]; then
            echo "::error::'latest' no se puede usar como tag de release."
            exit 1
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::El tag '$tag' no sigue el formato vX.Y.Z"; exit 1 ;;
          esac

      - name: Calcular referencias de imagen
        id: meta
        env:
          IMAGE_NAME: 
        run: |
          set -euo pipefail
          # ghcr exige owner y nombre de imagen en minúsculas.
          owner_lc=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          if [ -n "$IMAGE_NAME" ]; then
            name_lc=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          else
            name_lc=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
          fi
          {
            echo "sha_short=${GITHUB_SHA::7}"
            echo "image=ghcr.io/${owner_lc}/${name_lc}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
